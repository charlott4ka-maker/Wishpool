<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wishpool</title>
<meta name="description" content="Вішлисти для друзів, пари та днів народження в Telegram." />
<meta property="og:title" content="Wishpool" />
<meta property="og:description" content="Вішлисти для друзів, пари та днів народження в Telegram." />

<style>
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:800;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(/about/fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(/about/fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(/about/fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:800;font-display:swap;src:url(/about/fonts/montserrat-latin-800-normal.woff2) format("woff2")}

:root{
  --bg:#000; --t1:#fff; --t2:#8A8A8E; --t3:#5A5A5E;
  --blue:#2E7DF6; --blue-l:#7FB0FF;
  --glass:rgba(255,255,255,0.06); --glass-2:rgba(255,255,255,0.10);
  --hi:inset 0 1px 0 rgba(255,255,255,0.10);
  --lg:52px; --sm:40px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:Montserrat,system-ui,sans-serif;font-weight:500;color:var(--t1);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block}

/* matte glow behind everything, drifting slowly */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.glow i:nth-child(1){width:520px;height:520px;left:-160px;top:-120px;background:#1E5FD0}
.glow i:nth-child(2){width:420px;height:420px;right:-140px;top:30vh;background:#5B3FD6;opacity:.35;animation-duration:28s}
.glow i:nth-child(3){width:460px;height:460px;left:20vw;bottom:-220px;background:#0E8FB8;opacity:.3;animation-duration:32s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.1)}}

/* frosted glass, no outlines: blur + matte fill + a soft top highlight */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:var(--hi)}

/* header */
header{position:fixed;left:16px;right:16px;top:12px;z-index:20;max-width:1100px;margin:0 auto;border-radius:24px;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;height:64px;padding:0 12px 0 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo img{width:36px;height:36px}
.sp{flex:1}
.lang{display:flex;gap:4px;padding:4px;height:var(--sm);border-radius:999px;background:var(--glass)}
.lang button{height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--t2);font:600 13px Montserrat,sans-serif;cursor:pointer}
.lang button.on{background:rgba(255,255,255,.14);color:var(--t1)}
.progress{position:absolute;left:0;bottom:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#4A93FF,#9F7BFF)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font:600 16px Montserrat,sans-serif;cursor:pointer;white-space:nowrap;transition:transform .2s ease,background .2s ease}
.btn:active{transform:scale(.97)}
.btn.lg{height:var(--lg);padding:0 24px}
.btn.sm{height:var(--sm);padding:0 16px;font-size:14px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 32px rgba(46,125,246,.35)}
.btn.primary:hover{background:#3B87FF}
.btn.ghost{background:var(--glass-2);color:var(--t1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.btn svg{width:18px;height:18px}

main{position:relative;z-index:1}
section{max-width:1100px;margin:0 auto;padding:96px 16px}

/* hero */
.hero{min-height:100svh;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:32px;padding-top:120px}
.hero h1{font-size:clamp(48px,8vw,96px);font-weight:800;letter-spacing:-2.5px;line-height:1}
.typed{font-size:clamp(18px,2.2vw,24px);color:var(--t2);margin-top:16px;min-height:2.6em;line-height:1.3;max-width:520px}
.typed .cur{color:var(--t1);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.note{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:13px;margin-top:16px}
.note svg{width:14px;height:14px}

/* the folder scene (same as the app intro) */
.stage{position:relative;height:560px}
.scene{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transform:translate(-50%,-50%)}
.ring .spin{position:absolute;inset:0;animation:spin linear infinite}
.ring .it{position:absolute;transform:translate(-50%,-50%)}
.ring .it img{animation:spin linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.folder{position:absolute;left:50%;top:50%;width:260px;height:232px;margin:-116px 0 0 -130px;transform:rotate(-4deg)}
.folder .back{position:absolute;left:8%;right:8%;top:16%;bottom:10%;border-radius:20px;background:#1B4FA8}
.folder svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 24px 40px rgba(46,125,246,.35))}
.folder .drop{position:absolute;left:50%;top:22%;width:120px;opacity:0}
.folder .drop.go{animation:fall .8s cubic-bezier(.45,0,.6,1) forwards}
.folder .layer{position:absolute;inset:0;transform-origin:50% 100%}
.folder .layer.sq{animation:squish .5s ease}
@keyframes fall{0%{transform:translate(-50%,-260px) rotate(-14deg);opacity:0}12%{opacity:1}70%{transform:translate(-50%,-24px) rotate(6deg)}100%{transform:translate(-50%,44px) scale(.8);opacity:1}}
@keyframes squish{0%,100%{transform:none}35%{transform:scale(1.07,.88)}65%{transform:scale(.97,1.05)}}

/* sections */
.kicker{color:var(--blue-l);font-size:14px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
h2{font-size:clamp(32px,4.6vw,52px);font-weight:800;letter-spacing:-1.2px;line-height:1.08;margin-top:12px;max-width:760px}
.lead{color:var(--t2);font-size:18px;line-height:1.45;margin-top:16px;max-width:620px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.card{border-radius:32px;padding:32px 24px;position:relative;overflow:hidden}
.card .stk{width:84px;height:84px;object-fit:contain;transform:rotate(-8deg);margin:-8px 0 16px -8px;transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.card:hover .stk{transform:rotate(4deg) scale(1.08)}
.num{position:absolute;right:24px;top:24px;width:var(--sm);height:var(--sm);border-radius:50%;background:var(--glass-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--t2)}
.card h3{font-size:22px;font-weight:800;letter-spacing:-.4px}
.card p{color:var(--t2);font-size:15.5px;line-height:1.5;margin-top:8px}

.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.room{border-radius:32px;padding:24px;text-align:center}
.mini{position:relative;width:180px;height:160px;margin:8px auto 16px}
.mini .back{position:absolute;left:8%;right:8%;top:16%;bottom:10%;border-radius:16px;opacity:.55}
.mini svg{position:absolute;inset:0}
.mini img{position:absolute;left:16%;top:46%;width:58px;transform:rotate(-8deg)}
.room h3{font-size:20px;font-weight:800}
.room p{color:var(--t2);font-size:15px;line-height:1.5;margin-top:8px}

.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.feat{border-radius:24px;padding:24px;display:flex;gap:16px;align-items:flex-start}
.feat img{width:56px;height:56px;object-fit:contain;flex-shrink:0;transform:rotate(-6deg)}
.feat h3{font-size:17px;font-weight:700}
.feat p{color:var(--t2);font-size:14.5px;line-height:1.45;margin-top:4px}

.final{border-radius:40px;padding:64px 32px;text-align:center;position:relative;overflow:hidden}
.final h2{margin:0 auto}
.final .lead{margin:16px auto 0}
.final .cta{justify-content:center}
.final .float{position:absolute;width:88px;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}

footer{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 16px 48px;display:flex;justify-content:space-between;gap:16px;color:var(--t3);font-size:13px;flex-wrap:wrap}
footer a{color:var(--t2)}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;text-align:left;padding-top:112px;gap:8px}
  .stage{height:400px;order:-1}
  .scene{transform:scale(.66)}
  .steps,.rooms,.feats{grid-template-columns:1fr}
  section{padding:64px 16px}
  .final{padding:48px 24px}
  .final{padding:120px 24px 48px}
  .final .float{width:56px}
  .final .float:nth-of-type(3),.final .float:nth-of-type(4){display:none}
}
@media (max-width:420px){
  .bar{padding:0 8px 0 12px;gap:8px}
  .logo span{display:none}
  .lang button{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>

</main>

<footer>

</footer>

const pick = () => { const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q;
  try { const s = localStorage.getItem("wp_land_lang"); if (T[s]) return s; } catch (e) {}
  const n = (navigator.language || "").slice(0, 2); return n === "ru" ? "ru" : n === "uk" ? "uk" : n === "en" ? "en" : "uk"; };
let lang = pick();
function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = T[lang][el.dataset.t]; if (v == null) return;
    const span = el.querySelector(":scope > span"); (span && el.tagName === "A" && el.querySelector("svg") ? span : el).textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  type(T[lang].typed);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem("wp_land_lang", lang); } catch (e) {} apply(); });

// typewriter
let typeTimer;
function type(text) {
  clearInterval(typeTimer); const el = document.getElementById("typed"); let n = 0; el.textContent = "";
  typeTimer = setInterval(() => { el.textContent = text.slice(0, ++n); if (n >= text.length) clearInterval(typeTimer); }, 40);
}

// scroll progress in the header
const bar = document.getElementById("progress");
const onScroll = () => { const h = document.documentElement.scrollHeight - innerHeight; bar.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`; };
addEventListener("scroll", onScroll, { passive: true }); onScroll();

// reveal on scroll
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));

// folder shape (same outline as the app)
function folderPath(w, h) {
  const R = Math.round, x0 = R(w * .04), x1 = R(w * .96), yT = R(h * .28), yB = R(h * .37), y1 = R(h * .96), xt = R(w * .5), r = 18, rt = 14;
  const top = `M ${x0} ${yT + rt} Q ${x0} ${yT} ${x0 + rt} ${yT} L ${xt - 10} ${yT} C ${xt} ${yT} ${xt} ${yB} ${xt + 12} ${yB} L ${x1 - r} ${yB} Q ${x1} ${yB} ${x1} ${yB + r}`;
  return `${top} L ${x1} ${y1 - r} Q ${x1} ${y1} ${x1 - r} ${y1} L ${x0 + r} ${y1} Q ${x0} ${y1} ${x0} ${y1 - r} Z`;
}
document.getElementById("fp").setAttribute("d", folderPath(260, 232));
const mix = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
document.querySelectorAll(".room").forEach((r, i) => {
  const tint = r.dataset.tint, m = r.querySelector(".mini");
  m.innerHTML = `<div class="back" style="background:${tint}"></div><svg width="180" height="160"><defs><linearGradient id="mg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(tint, .95)}"/><stop offset="1" stop-color="${mix(tint, .7)}"/></linearGradient></defs><path d="${folderPath(180, 160)}" fill="url(#mg${i})"/></svg><img src="/stickers/${r.dataset.stk}.webp" alt="" />`;
});

// orbit stickers
const placeRing = (id, items, r) => {
  const el = document.getElementById(id);
  items.forEach((s, i) => { const a = i / items.length * Math.PI * 2;
    el.insertAdjacentHTML("beforeend", `<div class="it" style="left:${r + Math.cos(a) * r}px;top:${r + Math.sin(a) * r}px"><img src="/stickers/${s}.webp" alt="" style="width:66px;animation-duration:${el.style.animationDuration}" /></div>`); });
};
placeRing("ring1", ["ring", "plane", "gamepad"], 175);
placeRing("ring2", ["matcha", "sneakers", "picture", "lipstick"], 250);

// stickers falling into the folder, the folder bouncing as it catches them
const drops = ["headphones", "kitty", "cake", "gift"]; let di = 0;
const dropEl = document.getElementById("drop"), lb = document.getElementById("lb"), lf = document.getElementById("lf");
function dropNext() {
  dropEl.src = `/stickers/${drops[di++ % drops.length]}.webp`;
  dropEl.classList.remove("go"); void dropEl.offsetWidth; dropEl.classList.add("go");
  setTimeout(() => { [lb, lf].forEach(l => { l.classList.remove("sq"); void l.offsetWidth; l.classList.add("sq"); }); }, 580);
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { setTimeout(dropNext, 700); setInterval(dropNext, 2200); }

apply();
