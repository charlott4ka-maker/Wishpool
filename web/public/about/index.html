<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta property="og:image:width" content="1280" />
<meta property="og:image:height" content="720" />

<link rel="apple-touch-icon" href="/about/apple-touch-icon.png" />
<link rel="preload" as="image" href="/about/pool.webp" />

<style>
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:800;font-display:swap;src:url(/about/fonts/montserrat-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0400-04FF}
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(/about/fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Gochi Hand";font-weight:400;font-display:swap;src:url(/about/fonts/gochi-hand-latin-400.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(/about/fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(/about/fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:800;font-display:swap;src:url(/about/fonts/montserrat-latin-800-normal.woff2) format("woff2")}

:root{
  /* the app's dark theme (C in App.jsx) */
  --ink:#FFFFFF; --ink2:#8A8A8E; --blue:#2E7DF6; --deep:#1663C7;
  --card:rgba(22,22,24,0.84); --card2:#232326; --line:rgba(255,255,255,0.08);
  --blueSoft:rgba(46,125,246,0.16); --green:#34C759; --greenSoft:rgba(52,199,89,0.16);
  --hi:inset 0 1px 0 rgba(255,255,255,0.06);
  --lg:52px; --sm:40px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:#1A5FD0}
body{font-family:Montserrat,system-ui,sans-serif;font-weight:500;color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;-webkit-user-drag:none;user-select:none}

/* pool water: the photo plus a second, slower copy drifting over it so the light ripples */
.water{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#1A5FD0}
.water i{position:absolute;inset:-12%;background:url(/about/pool.webp) center/cover}
.water i:nth-child(1){animation:sway 26s ease-in-out infinite alternate}
.water i:nth-child(2){opacity:.22;mix-blend-mode:screen;transform:scale(1.25) rotate(180deg);animation:sway2 19s ease-in-out infinite alternate}
.water u{position:absolute;inset:0;background:linear-gradient(180deg,#0B3C9A,#061F5C);opacity:0;will-change:opacity}
.water b{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,90,210,.32) 0%,rgba(20,90,210,.18) 45%,rgba(10,60,170,.5) 100%);mix-blend-mode:multiply}
@keyframes sway{to{transform:translate(3%,2%) scale(1.04)}}
@keyframes sway2{to{transform:scale(1.25) rotate(180deg) translate(4%,3%)}}

/* header: a frosted capsule in the middle */
header{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;width:min(560px,calc(100% - 32px));border-radius:999px;
  background:rgba(22,22,24,0.62);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 32px rgba(0,10,40,.3)}
.bar{display:flex;align-items:center;gap:8px;height:60px;padding:0 10px 0 14px}
.bar .sp{flex:1}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.3px;flex-shrink:0}
.logo img{width:34px;height:34px;object-fit:contain;transform:rotate(-6deg)}
/* the wordmark is hand-lettered, the rest of the page stays Montserrat */
.logo span{font-family:"Gochi Hand",Montserrat,cursive;font-weight:400;font-size:24px;letter-spacing:.2px;line-height:1}
nav{display:flex;gap:4px;margin:0 auto}
nav a{height:var(--sm);padding:0 12px;display:flex;align-items:center;border-radius:999px;font-size:14px;font-weight:600;color:rgba(255,255,255,.88);transition:background .2s}
nav a:hover{background:rgba(255,255,255,.08)}
.prog{position:absolute;left:24px;right:24px;bottom:0;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{position:absolute;inset:0;background:var(--blue);transform-origin:0 50%;transform:scaleX(0)}

/* language: a small dropdown */
.lang{position:relative}
.lang>button{height:var(--sm);padding:0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font:600 14px Montserrat,sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer}
.lang>button svg{width:16px;height:16px;transition:transform .2s}
.lang.open>button svg.ch{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:160px;padding:6px;border-radius:20px;background:rgba(35,35,38,.92);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 16px 40px rgba(0,0,0,.4);
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .18s,transform .18s}
.lang.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu button{width:100%;height:var(--sm);border:0;border-radius:14px;background:transparent;color:var(--ink);font:600 14px Montserrat,sans-serif;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer}
.menu button:hover{background:rgba(255,255,255,.06)}
.menu button svg{width:16px;height:16px;color:var(--blue);opacity:0}
.menu button.on svg{opacity:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font:600 16px Montserrat,sans-serif;cursor:pointer;white-space:nowrap;transition:transform .2s ease,box-shadow .2s ease}
.btn:active{transform:scale(.97)}
.btn.lg{height:var(--lg);padding:0 28px}
.btn.sm{height:var(--sm);padding:0 16px;font-size:14px}
.btn.white{background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(0,20,80,.3)}
.btn.white:hover{box-shadow:0 14px 40px rgba(0,20,80,.4)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(46,125,246,.35)}
.btn.dark{background:var(--blue);color:#fff}
.btn svg{width:18px;height:18px}

main{position:relative;z-index:1}
section{max-width:1120px;margin:0 auto;padding:96px 16px}

/* hero, laid out like the reference: big title, cards across it, line, button */
.hero{padding:132px 16px 72px;text-align:center}
.hero h1{font-size:clamp(44px,8.4vw,108px);font-weight:700;letter-spacing:-.045em;line-height:.98;max-width:980px;margin:0 auto -.16em;padding-bottom:.16em;
  -webkit-mask-image:linear-gradient(180deg,#000 50%,rgba(0,0,0,.28) 100%);mask-image:linear-gradient(180deg,#000 50%,rgba(0,0,0,.28) 100%)}
.stage{-webkit-user-select:none;user-select:none;position:relative;height:420px;max-width:1000px;margin:-56px auto 0;touch-action:pan-y}
.hcard{position:absolute;background:#161618;color:var(--ink);border-radius:26px;padding:16px;box-shadow:0 20px 50px rgba(0,10,40,.35);text-align:left}
.hcard .t{font-weight:700;font-size:15px;line-height:1.35}
.hcard .s{color:var(--ink2);font-size:12.5px;margin-top:4px}
.hcard .row{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;white-space:nowrap;border-radius:999px;background:var(--blueSoft);color:var(--blue);font-weight:700;font-size:12px}
.chip.green{background:var(--greenSoft);color:var(--green)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;box-shadow:0 0 0 2px #161618}
.av+.av{margin-left:-8px}

.folder{position:absolute;left:50%;top:50%;width:280px;height:250px;margin:-125px 0 0 -140px;z-index:3}
.folder .back{position:absolute;left:8%;right:8%;top:16%;bottom:10%;border-radius:22px;background:#1B4FA8}
.folder .layer{position:absolute;inset:0;transform-origin:50% 100%}
.folder .layer.sq{animation:squish .5s ease}
.folder svg{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 26px 40px rgba(10,60,140,.35))}
.folder .gc{position:absolute;width:92px;height:104px;border-radius:12px;background:var(--card2);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:10px}
.folder .gc img{width:72px}
.folder .on{position:absolute;width:80px;pointer-events:none;transform:rotate(var(--r));filter:drop-shadow(0 6px 10px rgba(10,40,110,.22))}
.folder .on.pop{animation:popr .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popr{from{transform:rotate(var(--r)) scale(1.2)}to{transform:rotate(var(--r))}}
.folder.hot svg{filter:drop-shadow(0 0 0 4px #fff) drop-shadow(0 26px 40px rgba(10,60,140,.35))}
@keyframes squish{0%,100%{transform:none}35%{transform:scale(1.08,.86)}65%{transform:scale(.96,1.05)}}

.stk{position:absolute;width:112px;z-index:4;cursor:grab;touch-action:none;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 18px 14px rgba(0,30,90,.38))}
.stk img{width:100%;pointer-events:none}
.stk.drag{cursor:grabbing;animation:none;z-index:10;transition:none}
.stk.back{transition:left .5s cubic-bezier(.2,1.4,.4,1),top .5s cubic-bezier(.2,1.4,.4,1)}
.stk.in{transition:left .35s ease,top .35s ease,transform .35s ease,opacity .35s ease;transform:scale(.77)!important;animation:none}
.stk.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.hint{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:rgba(22,22,24,.5);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:13px;font-weight:600;margin-top:8px}
.hint svg{width:16px;height:16px}
.sub{font-size:clamp(17px,2vw,21px);line-height:1.45;max-width:520px;margin:24px auto 0;color:rgba(255,255,255,.92)}
.hero .cta{margin-top:32px}

/* sections on the water: dark frosted cards like the app */
.kicker{font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
h2{font-size:clamp(32px,4.8vw,56px);font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:12px;max-width:780px}
.lead{font-size:18px;line-height:1.45;margin-top:16px;max-width:620px;color:rgba(255,255,255,.9)}
.wcard{background:var(--card);color:var(--ink);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);box-shadow:var(--hi),0 20px 50px rgba(0,10,40,.3)}
.steps,.rooms,.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.card{border-radius:32px;padding:32px 24px;position:relative}
.card .ic{width:88px;height:88px;object-fit:contain;transform:rotate(-8deg);margin:-8px 0 16px -8px;transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.card:hover .ic{transform:rotate(4deg) scale(1.08)}
.num{position:absolute;right:24px;top:24px;width:var(--sm);height:var(--sm);border-radius:50%;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
.card h3,.room h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.card p,.room p{color:var(--ink2);font-size:15.5px;line-height:1.5;margin-top:8px}
.room{border-radius:32px;padding:24px;text-align:center}
.mini{position:relative;width:190px;height:170px;margin:8px auto 16px}
/* same build as the app's room folder: tinted back, photos cut at the front's edge, frosted front */
.mini .back{position:absolute;left:8%;right:8%;top:16%;bottom:10%;border-radius:16px}
.mini .ph{position:absolute;inset:0;z-index:2;pointer-events:none}
.mini .ph i{position:absolute;width:34%;aspect-ratio:.82;border-radius:10px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.mini .ph i img{width:78%}
.mini .ph svg{position:absolute;inset:0;overflow:visible}
.mini .fr{position:absolute;inset:0;z-index:3;-webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%)}
.mini .st{position:absolute;left:14%;top:44%;width:58px;z-index:4;transform:rotate(-8deg)}
.mini .avs{position:absolute;right:11%;bottom:12%;z-index:4;display:flex}
.mini .avs b{width:24px;height:24px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #161618}
.mini .avs b+b{margin-left:-8px}
.feat{border-radius:26px;padding:16px 24px 16px 16px;display:flex;gap:12px;align-items:center}
.feat img{width:52px;height:52px;object-fit:contain;flex-shrink:0;transform:rotate(-6deg);transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.feat:hover img{transform:rotate(6deg) scale(1.1)}
.feat h3{font-size:17px;font-weight:700}
/* recorded straight from the app's onboarding: the phone fades into the card, so the card is solid */
.demos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}
.demo{background:#161618;border-radius:32px;padding:32px 24px 28px;text-align:center;box-shadow:0 20px 50px rgba(0,10,40,.3)}
.demo video{display:block;width:278px;max-width:100%;aspect-ratio:416/666;margin:0 auto -12px;background:#161618;clip-path:inset(0 0 3% 0)}
.demo h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.demo p{color:var(--ink2);font-size:15.5px;margin-top:6px}
.final{border-radius:40px;padding:72px 32px;text-align:center;position:relative;overflow:hidden}
.final h2{margin:0 auto;color:var(--ink);max-width:620px}
.final .lead{margin:16px auto 0;color:var(--ink2)}
.final .cta{margin-top:32px}
.final .float{position:absolute;width:100px;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(0,0,0,.35))}

footer{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:16px 16px 48px;display:flex;justify-content:space-between;gap:16px;font-size:13px;color:rgba(255,255,255,.8);flex-wrap:wrap}

/* our star riding down the side, turning as you scroll */
.badge{position:fixed;right:28px;top:50%;width:132px;height:132px;margin-top:-66px;z-index:20}
.badge img{width:100%;height:100%;object-fit:contain;will-change:transform;filter:drop-shadow(0 18px 24px rgba(0,25,80,.35))}
@media (max-width:860px){.badge{width:60px;height:60px;right:10px;top:auto;bottom:16px;margin:0}}

.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}

@media (max-width:860px){
  nav{display:none}
  .bar .sp{flex:1}
  .hero{padding-top:112px}
  .stage{height:440px;margin-top:8px}
  .folder{transform:scale(.72)}
  .hide-m{display:none}
  .stk{width:76px}
  .steps,.rooms,.feats,.demos{grid-template-columns:1fr}
  .feats{grid-template-columns:1fr 1fr;gap:12px}
  .feat{padding:12px;gap:8px;border-radius:20px}
  .feat img{width:40px;height:40px}
  .feat h3{font-size:14px}
  section{padding:64px 16px}
  .final{padding:120px 24px 48px}
  .final .float{width:58px}
  .final .float:nth-of-type(n+3){display:none}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="water"><i></i><i></i><b></b><u id="dim"></u></div>

<header>
  <div class="bar">
    <a class="logo" href="#top"><img src="/about/star.png" alt="" /><span>Wishpool</span></a>
    <div class="sp"></div>
    <div class="lang" id="lang">
      <button type="button" id="langBtn" aria-haspopup="listbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span id="langCur"></span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" role="listbox">
        <button data-l="uk">Українська<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button data-l="ru">Русский<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button data-l="en">English<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
      </div>
    </div>
    <a class="btn sm white" href="https://t.me/wishpool_bot/app" data-t="open"></a>
  </div>
  <div class="prog"><i id="prog"></i></div>
</header>

<a class="badge" href="https://t.me/wishpool_bot/app" aria-label="Wishpool"><img id="badgeSpin" src="/about/spinstar.webp" alt="" /></a>

<main id="top">
  <section class="hero">
    <h1 class="rv" data-t="title"></h1>
    <div class="stage rv d1" id="stage">
      <div class="folder" id="folder">
        <div class="layer" id="lb"><div class="back"></div><div class="gc" style="left:22%;top:6%;transform:rotate(-9deg)"><img src="/stickers/headphones.webp" alt="" /></div><div class="gc" style="left:47%;top:3%;transform:rotate(7deg)"><img src="/stickers/candle.webp" alt="" /></div><div class="gc" style="left:62%;top:10%;transform:rotate(15deg)"><img src="/stickers/sneakers.webp" alt="" /></div></div>
        <div class="layer" id="lf"><svg width="280" height="250"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AA2FF"/><stop offset="1" stop-color="#2E7DF6"/></linearGradient></defs><path id="fp" fill="url(#fg)"/></svg></div>
      </div>
    </div>
    <div class="hint rv d1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><span data-t="hint"></span></div>
    <p class="sub rv d2" data-t="sub"></p>
    <div class="cta rv d2"><a class="btn lg white" href="https://t.me/wishpool_bot/app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg><span data-t="openTg"></span></a></div>
  </section>

  <section id="rooms">
    <p class="kicker rv" data-t="roomsK"></p>
    <h2 class="rv d1" data-t="roomsT"></h2>
    <div class="rooms">

// Language: ?lang=, then the saved choice, then the browser's language if we
// speak it (uk/ru/en), and Ukrainian for everything else.
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q;
  try { const s = localStorage.getItem("wp_land_lang"); if (T[s]) return s; } catch (e) {}
  for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""])) {
    const c = String(l).toLowerCase().slice(0, 2); if (T[c]) return c;
  }
  return "uk";
}
let lang = pickLang(), inFolder = 0;
function apply() {
  document.documentElement.lang = lang;
  const L = T[lang];
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = L[el.dataset.t]; if (typeof v !== "string") return;
    const span = el.tagName === "A" && el.querySelector("svg") ? el.querySelector("span") : null;
    (span || el).textContent = v;
  });
  document.getElementById("langCur").textContent = L.short;
  document.querySelectorAll(".menu button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  // demo videos in the page's language
  document.querySelectorAll("video[data-v]").forEach(v => {
    const src = `/about/demo/${v.dataset.v}_${lang}.mp4`;
    if (v.getAttribute("src") === src) return;
    v.poster = `/about/demo/${v.dataset.v}_${lang}.jpg`; v.src = src;
    v.play && v.play().catch(() => {});
  });
}
const langBox = document.getElementById("lang");
document.getElementById("langBtn").onclick = e => { e.stopPropagation(); langBox.classList.toggle("open"); };
document.addEventListener("click", () => langBox.classList.remove("open"));
document.querySelectorAll(".menu button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("wp_land_lang", lang); } catch (e) {} apply();
});

// scroll: progress line in the header, the badge spins as the page moves
const dim = document.getElementById("dim"), prog = document.getElementById("prog"), spin = document.getElementById("badgeSpin");
const onScroll = () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  prog.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`;
  spin.style.transform = `rotate(${scrollY * 0.25}deg)`;
  // light only on the first screen, then the pool gets deeper towards the bottom
  const d = h > innerHeight * .3 ? (scrollY - innerHeight * .3) / (h - innerHeight * .3) : 0;
  dim.style.opacity = (Math.max(0, Math.min(1, d)) * .72).toFixed(3);
};
addEventListener("scroll", onScroll, { passive: true }); onScroll();

// reveal on scroll
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));

// folder outline, same as the app
function folderPath(w, h, onlyTop) {
  const R = Math.round, x0 = R(w * .04), x1 = R(w * .96), yT = R(h * .28), yB = R(h * .37), y1 = R(h * .96), xt = R(w * .5), r = 18, rt = 14;
  const top = `M ${x0} ${yT + rt} Q ${x0} ${yT} ${x0 + rt} ${yT} L ${xt - 10} ${yT} C ${xt} ${yT} ${xt} ${yB} ${xt + 12} ${yB} L ${x1 - r} ${yB} Q ${x1} ${yB} ${x1} ${yB + r}`;
  if (onlyTop) return top;
  return `${top} L ${x1} ${y1 - r} Q ${x1} ${y1} ${x1 - r} ${y1} L ${x0 + r} ${y1} Q ${x0} ${y1} ${x0} ${y1 - r} Z`;
}
document.getElementById("fp").setAttribute("d", folderPath(280, 250));
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const SPOTS = [{ l: 33, t: 2, r: 0, z: 2 }, { l: 9, t: 16, r: -10, z: 1 }, { l: 57, t: 12, r: 9, z: 1 }];
const AVS = [["#7B61FF", "Я"], ["#FF9F0A", "А"], ["#34C759", "Б"]];
document.querySelectorAll(".room").forEach((r, i) => {
  const t = r.dataset.tint, W = 190, H = 170, full = folderPath(W, H);
  const cut = `path(evenodd, 'M -60 -60 H ${W + 60} V ${H + 60} H -60 Z ${full}')`;
  const photos = r.dataset.photos.split(" ").map((s, k) => { const p = SPOTS[k];
    return `<i style="left:${p.l}%;top:${p.t}%;z-index:${p.z};transform:rotate(${p.r}deg);background:#232326"><img src="/stickers/${s}.webp" alt="" /></i>`; }).join("");
  const avs = AVS.slice(0, +r.dataset.people).map(([c, l]) => `<b style="background:${c}">${l}</b>`).join("");
  r.querySelector(".mini").innerHTML = `<div class="back" style="background:${rgba(t, .32)}"></div>
    <div class="ph" style="clip-path:${cut};-webkit-clip-path:${cut}">${photos}
      <svg width="${W}" height="${H}"><defs><filter id="fs${i}" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4"/></filter><clipPath id="fc${i}"><rect x="${Math.round(W * .04) + 6}" y="0" width="${Math.round(W * .92) - 12}" height="${H}"/></clipPath></defs><g clip-path="url(#fc${i})"><path d="${folderPath(W, H, true)}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="10" filter="url(#fs${i})"/></g></svg></div>
    <div class="fr" style="clip-path:path('${full}');-webkit-clip-path:path('${full}');background:linear-gradient(180deg,${rgba(t, .42)} 0%,${rgba(t, .26)} 100%)"></div>
    <img class="st" src="/stickers/${r.dataset.stk}.webp" alt="" /><div class="avs">${avs}</div>`;
});


// drag stickers into the folder (mouse or finger)
const stage = document.getElementById("stage"), folder = document.getElementById("folder"), lb = document.getElementById("lb"), lf = document.getElementById("lf");
const STK = [
  { s: "kitty", x: 14, y: 8, d: 0 }, { s: "cake", x: 74, y: 4, d: -1.2 },
  { s: "gift", x: 8, y: 66, d: -2.4 }, { s: "uno", x: 80, y: 66, d: -3.1 },
];
// where dropped stickers land on the folder front (folder px, 280x250)
const SLOT = [{ x: 92, y: 150, r: -10 }, { x: 190, y: 148, r: 9 }, { x: 140, y: 196, r: 4 }, { x: 222, y: 200, r: -7 }];
function squish() { [lb, lf].forEach(l => { l.classList.remove("sq"); void l.offsetWidth; l.classList.add("sq"); }); }
if (matchMedia("(max-width:860px)").matches) Object.assign(STK[3], { x: 70, y: 74 });
STK.forEach(o => {
  const el = document.createElement("div");
  el.className = "stk"; el.style.left = o.x + "%"; el.style.top = o.y + "%"; el.style.animationDelay = o.d + "s";
  el.innerHTML = `<img src="/about/obj/${o.s}.webp" alt="" />`;
  stage.appendChild(el);
  let sx, sy, ox, oy, moved = false;
  el.addEventListener("pointerdown", e => {
    if (el.classList.contains("in")) return;
    el.setPointerCapture(e.pointerId); el.classList.remove("back", "pop"); el.classList.add("drag");
    const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left - sr.left; oy = r.top - sr.top; moved = false;
  });
  el.addEventListener("pointermove", e => {
    if (!el.classList.contains("drag")) return;
    moved = true;
    el.style.left = ox + e.clientX - sx + "px"; el.style.top = oy + e.clientY - sy + "px";
    folder.classList.toggle("hot", over(el));
  });
  const end = () => {
    if (!el.classList.contains("drag")) return;
    el.classList.remove("drag"); folder.classList.remove("hot");
    if (moved && over(el)) {
      const slot = SLOT[inFolder++ % SLOT.length], fr = folder.getBoundingClientRect(), sr = stage.getBoundingClientRect(), w = el.offsetWidth, k = fr.width / 280;
      el.classList.add("in");
      el.style.left = fr.left - sr.left + slot.x * k - w / 2 + "px"; el.style.top = fr.top - sr.top + slot.y * k - w / 2 + "px";
      setTimeout(() => {
        el.remove(); squish();
        const img = document.createElement("img");
        img.className = "on pop"; img.src = `/about/obj/${o.s}.webp`; img.alt = "";
        Object.assign(img.style, { left: slot.x - 37 + "px", top: slot.y - 37 + "px" }); img.style.setProperty("--r", slot.r + "deg");
        lf.appendChild(img);
      }, 330);
    } else { el.classList.add("back"); el.style.left = o.x + "%"; el.style.top = o.y + "%"; }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
});
function over(el) {
  const a = el.getBoundingClientRect(), f = folder.getBoundingClientRect();
  const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
  return cx > f.left + f.width * .08 && cx < f.right - f.width * .08 && cy > f.top && cy < f.bottom;
}

apply();
